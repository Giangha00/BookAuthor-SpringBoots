<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${pageTitle})}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main id="content" class="container narrow">
    <div th:replace="~{fragments/layout :: alerts}"></div>
    <h1 th:text="${pageTitle}">Thêm nhà xuất bản</h1>
    <form class="card" th:action="@{/publishers}" th:object="${publisherForm}" method="post">
        <input type="hidden" th:field="*{id}">
        <label for="name">Tên</label>
        <input id="name" type="text" th:field="*{name}" th:classappend="${#fields.hasErrors('name')} ? 'invalid'" required>
        <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
        <div class="form-actions">
            <button type="submit" class="btn">Lưu</button>
            <a th:href="@{/publishers}">Hủy</a>
        </div>
    </form>
</main>
</body>
</html>
